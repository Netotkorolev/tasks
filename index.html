<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Задачи — Егор</title>
<style>
:root{
  --bg:#0d0d0f;
  --surface:#1c1c1e;
  --surface-2:#2c2c2e;
  --border:#2c2c2e;
  --text:#f5f5f5;
  --text-secondary:#8e8e93;
  --text-tertiary:#636366;
  --accent:#0A84FF;
  --accent-soft:rgba(10,132,255,0.15);
  --red:#ff453a;
  --yellow:#ffd60a;
  --green:#30d158;
  --purple:#bf5af2;
  --r-sm:6px;
  --r-md:10px;
  --r-lg:12px;
  --sp-1:4px;
  --sp-2:8px;
  --sp-3:12px;
  --sp-4:16px;
  --sp-5:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:contain}
header{background:var(--surface);padding:var(--sp-4);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
header h1{font-size:20px;font-weight:700}
header p{font-size:12px;color:var(--text-secondary);margin-top:2px}
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:53px;z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tab{flex:0 0 auto;min-width:64px;text-align:center;padding:11px 10px;font-size:12px;font-weight:500;color:var(--text-secondary);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;touch-action:manipulation}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.view{display:none;padding:var(--sp-3) var(--sp-4) calc(env(safe-area-inset-bottom) + 110px)}
.view.active{display:block}
.chat-box{background:var(--surface);border-radius:var(--r-lg);padding:14px;margin-bottom:12px;min-height:60px}
.msg{padding:10px 13px;border-radius:var(--r-lg);font-size:14px;line-height:1.5;margin-bottom:8px;max-width:88%}
.msg.user{background:var(--accent);color:#fff;margin-left:auto}
.msg.bot{background:var(--surface-2);color:var(--text)}
.msg.loading{background:var(--surface-2);color:var(--text-secondary);font-style:italic}
textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;font-size:16px;line-height:1.4;color:var(--text);resize:vertical;min-height:140px;font-family:inherit}
textarea:focus{outline:none;border-color:#444}
textarea::placeholder{color:var(--text-tertiary)}
.send-btn{width:100%;margin-top:8px;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-lg);font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation}
.send-btn:active{opacity:0.85}
.hint{font-size:12px;color:var(--text-tertiary);margin-top:6px;text-align:center}
.section-label{font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px}
.task-card{background:var(--surface);border-radius:var(--r-lg);margin-bottom:8px;overflow:hidden;position:relative}
.task-card.dragging{opacity:0.4}
.task-card.urgent{box-shadow:inset 3px 0 0 var(--red)}
.task-card.frog{border:1px solid rgba(191,90,242,0.4);background:rgba(191,90,242,0.08)}
.frog-reason{font-size:12px;color:var(--purple);font-weight:500;margin-top:4px}
.board{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;scroll-snap-type:x mandatory;overscroll-behavior:contain}
.board-col{background:var(--surface);border-radius:var(--r-lg);min-width:280px;flex:0 0 280px;padding:10px;display:flex;flex-direction:column;scroll-snap-align:start}
.board-col.drag-over{outline:2px dashed var(--accent);background:var(--accent-soft)}
.board-col-header{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;padding:4px 4px 8px}
.board-col-count{font-size:11px;color:var(--text-secondary);background:var(--surface-2);border-radius:var(--r-sm);padding:1px 7px}
.board-col-tasks .task-card{margin-bottom:8px}
.board-col-tasks .task-card:last-child{margin-bottom:0}
.task-main{display:flex;align-items:flex-start;gap:12px;padding:13px 34px 13px 13px}
.check{width:22px;height:22px;border-radius:50%;border:2px solid #444;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px;transition:all 0.15s;position:relative;touch-action:manipulation}
.check::after{content:'';position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.check.done{background:var(--accent);border-color:var(--accent)}
.check svg{display:none}
.check.done svg{display:block}
.task-body{flex:1;min-width:0}
.task-text{font-size:16px;line-height:1.4;color:var(--text)}
.task-text.done{text-decoration:line-through;opacity:0.4}
.task-desc{font-size:12px;color:var(--text-secondary);margin-top:3px}
.imp-star{color:var(--yellow);margin-right:2px}
.task-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:6px;font-size:12px;color:var(--text-secondary)}
.task-meta .meta-overdue{color:var(--red)}
.task-meta .meta-sep{color:var(--text-tertiary)}
.task-meta .proj-dot{width:7px;height:7px;flex-shrink:0}
.task-meta.done{opacity:0.4}
.task-notes{font-size:12px;color:var(--text-secondary);margin-top:3px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task-menu-btn{position:absolute;top:6px;right:6px;width:26px;height:26px;border:none;background:transparent;color:var(--text-secondary);font-size:18px;line-height:1;border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;touch-action:manipulation}
.task-menu-btn::after{content:'';position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.task-menu-btn:active{background:var(--surface-2)}
.task-menu{display:none;position:absolute;top:32px;right:6px;background:var(--surface-2);border-radius:var(--r-md);overflow:hidden;z-index:10;min-width:130px;box-shadow:0 4px 16px rgba(0,0,0,0.4)}
.task-menu.open{display:block}
.task-menu button{display:block;width:100%;text-align:left;padding:10px 14px;font-size:13px;background:none;border:none;color:var(--text);cursor:pointer;font-family:inherit;touch-action:manipulation}
.task-menu button:active{background:#3a3a3c}
.task-menu button.danger{color:var(--red)}
.proj-card{background:var(--surface);border-radius:var(--r-lg);margin-bottom:12px;padding:14px}
.proj-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.proj-dot{width:9px;height:9px;border-radius:50%}
.proj-name{font-size:15px;font-weight:600;flex:1}
.proj-pct{font-size:12px;color:var(--text-secondary)}
.prog-bar{height:4px;background:var(--surface-2);border-radius:2px;margin-bottom:10px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px}
.empty{text-align:center;color:var(--text-tertiary);font-size:14px;padding:30px 0}
.more-link{display:block;width:100%;text-align:center;background:none;border:none;color:var(--accent);font-size:13px;font-weight:500;padding:10px;cursor:pointer;font-family:inherit;touch-action:manipulation}
.today-indicator{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px 14px;font-size:12px;color:var(--text-secondary);text-align:center;cursor:pointer;touch-action:manipulation}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.login-box{background:var(--surface);border-radius:var(--r-lg);padding:24px;width:100%;max-width:360px}
.login-box h2{font-size:20px;margin-bottom:16px;text-align:center}
.login-box input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:12px;font-size:14px;color:var(--text);margin-bottom:10px;font-family:inherit}
.login-box input:focus{outline:none;border-color:#444}
.login-error{color:var(--red);font-size:13px;margin-top:8px;text-align:center;min-height:16px}
.header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.logout-btn{background:none;border:1px solid var(--border);color:var(--text-secondary);font-size:12px;padding:6px 12px;border-radius:var(--r-sm);cursor:pointer;flex-shrink:0;touch-action:manipulation}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal-box{background:var(--surface);border-radius:var(--r-lg);padding:18px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain}
.modal-box h3{font-size:16px;margin-bottom:14px}
.field-label{font-size:12px;color:var(--text-secondary);margin:10px 0 5px;display:block}
.modal-box input[type=text],.modal-box input[type=date],.modal-box select,.modal-box textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:11px;font-size:14px;color:var(--text);font-family:inherit}
.modal-box input:focus,.modal-box select:focus,.modal-box textarea:focus{outline:none;border-color:#444}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.checkbox-row input{width:auto}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.modal-actions button{flex:1;padding:12px;border-radius:var(--r-md);border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation}
.modal-actions .save-btn{background:var(--accent);color:#fff}
.modal-actions .cancel-btn{background:var(--surface-2);color:var(--text-secondary)}
@media (max-width:480px){
  .task-main{padding:9px 32px 9px 11px;gap:10px}
  .board-col{min-width:85vw;flex:0 0 85vw}
}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <h2>Вход</h2>
    <input type="email" id="login-email" placeholder="Email" value="eakorolev@gmail.com">
    <input type="password" id="login-password" placeholder="Пароль">
    <button class="send-btn" onclick="login()">Войти</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>
<div id="app" style="display:none">
<header>
  <div class="header-row">
    <div>
      <h1>Задачи</h1>
      <p id="hdate"></p>
    </div>
    <button class="logout-btn" onclick="logout()">Выйти</button>
  </div>
</header>
<div class="tabs">
  <button class="tab active" onclick="switchTab('secretary',this)">Секретарь</button>
  <button class="tab" onclick="switchTab('today',this)">Сегодня</button>
  <button class="tab" onclick="switchTab('board',this)">Доска</button>
  <button class="tab" onclick="switchTab('projects',this)">Проекты</button>
  <button class="tab" onclick="switchTab('done',this)">Выполнено</button>
</div>
<div class="view active" id="view-secretary">
  <div class="chat-box" id="chat"></div>
  <textarea id="tinput" placeholder="Пиши задачи в свободной форме. Например: надо сегодня забрать Петра из больницы до 15, написать Зимину по попкорну до пятницы, на неделе 2 поста для канала..."></textarea>
  <button class="send-btn" onclick="sendMsg()">Разобрать задачи</button>
  <div class="hint">Напиши или надиктуй всё одним текстом — секретарь разложит по задачам.</div>
</div>
<div class="view" id="view-today"><div id="today-content"></div></div>
<div class="view" id="view-board"><div class="board" id="board-content"></div></div>
<div class="view" id="view-projects"><div id="proj-content"></div></div>
<div class="view" id="view-done"><div id="done-content"></div></div>
</div>
<div class="modal-overlay" id="edit-overlay">
  <div class="modal-box">
    <h3>Редактировать задачу</h3>
    <label class="field-label" for="edit-text">Текст</label>
    <textarea id="edit-text" rows="3"></textarea>
    <label class="field-label" for="edit-notes">Заметки</label>
    <textarea id="edit-notes" rows="2"></textarea>
    <label class="field-label" for="edit-project">Проект</label>
    <select id="edit-project"></select>
    <label class="field-label" for="edit-date">Дата</label>
    <input type="date" id="edit-date">
    <label class="field-label" for="edit-effort">Объём</label>
    <select id="edit-effort"></select>
    <label class="field-label" for="edit-status">Статус</label>
    <select id="edit-status"></select>
    <div class="checkbox-row">
      <input type="checkbox" id="edit-urgent">
      <label for="edit-urgent">Срочно</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="edit-important">
      <label for="edit-important">Важно</label>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeTaskEditor()">Отмена</button>
      <button class="save-btn" onclick="saveTaskEdit()">Сохранить</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://apijeywkwtjezgeuhkhm.supabase.co';
const SUPA_KEY='sb_publishable_xYbI9DTHWUME1YZlc2dCCw_jHr9D273';
const PROJECTS=[
  {id:'law',name:'Судебное дело',color:'#ff453a'},
  {id:'popcorn',name:'Rush Попкорн',color:'#ff9f0a'},
  {id:'politics',name:'Новые люди',color:'#0a84ff'},
  {id:'fencing',name:'Не тот Королёв',color:'#30d158'},
  {id:'china',name:'Маркетплейсы',color:'#bf5af2'},
  {id:'istra',name:'Помещение Истра',color:'#888'},
  {id:'tma',name:'AI / TMA / разработка',color:'#5ac8fa'},
  {id:'health',name:'Пётр Михайлович',color:'#ff375f'},
  {id:'personal',name:'Личное',color:'#00c7be'},
  {id:'other',name:'Разное',color:'#666'},
];
const EFFORT_OPTIONS=[
  {id:'',name:'—'},
  {id:'2m',name:'2 мин'},
  {id:'5m',name:'5 мин'},
  {id:'15m',name:'15 мин'},
  {id:'30m',name:'30 мин'},
  {id:'60m',name:'60 мин'},
  {id:'elephant',name:'Слон'},
];
const STATUS_OPTIONS=[
  {id:'inbox',name:'Входящие'},
  {id:'next',name:'Без даты'},
  {id:'scheduled',name:'Запланировано'},
  {id:'doing',name:'В работе'},
  {id:'waiting',name:'Ожидаю'},
  {id:'someday',name:'Когда-нибудь'},
  {id:'done',name:'Готово'},
];
const STATUS_LABELS=Object.fromEntries(STATUS_OPTIONS.map(o=>[o.id,o.name]));
const BOARD_COLUMNS=[
  {status:'inbox',    name:'Входящие',     match:t=>!t.done&&(t.status||'next')==='inbox'},
  {status:'next',     name:'Без даты',     match:t=>!t.done&&(t.status||'next')==='next'&&!t.due_date},
  {status:'scheduled',name:'Запланировано',match:t=>!t.done&&(t.status==='scheduled'||((t.status||'next')==='next'&&t.due_date))},
  {status:'doing',    name:'В работе',     match:t=>!t.done&&t.status==='doing'},
  {status:'waiting',  name:'Ожидаю',       match:t=>!t.done&&t.status==='waiting'},
  {status:'someday',  name:'Когда-нибудь', match:t=>!t.done&&t.status==='someday'},
  {status:'done',     name:'Готово',       match:t=>t.done||t.status==='done'},
];
const supabaseClient=supabase.createClient(SUPA_URL,SUPA_KEY);
let tasks=[];
async function dbFetch(path,opts={}){
  const {data:{session}}=await supabaseClient.auth.getSession();
  const token=session?session.access_token:SUPA_KEY;
  const r=await fetch(SUPA_URL+'/rest/v1/'+path,{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})},
    ...opts
  });
  const txt=await r.text();
  return txt?JSON.parse(txt):[];
}
async function login(){
  const email=document.getElementById('login-email').value.trim();
  const password=document.getElementById('login-password').value;
  const errEl=document.getElementById('login-error');
  errEl.textContent='';
  if(!email||!password){errEl.textContent='Введите email и пароль';return;}
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)errEl.textContent='Ошибка входа: '+error.message;
}
async function logout(){
  await supabaseClient.auth.signOut();
}
function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='';
}
function showLogin(){
  document.getElementById('login-screen').style.display='';
  document.getElementById('app').style.display='none';
  document.getElementById('login-password').value='';
}
async function loadTasks(){
  try{tasks=await dbFetch('tasks?select=*&order=created_at.desc');}catch(e){tasks=[];}
  renderAll();
}
async function toggleTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;
  await dbFetch('tasks?id=eq.'+id,{method:'PATCH',body:JSON.stringify({done:t.done})});
  renderAll();
}
async function sendMsg(){
  const inp = document.getElementById('tinput');
  const text = inp.value.trim();
  if (!text) return;

  inp.value = '';

  const chat = document.getElementById('chat');

  const um = document.createElement('div');
  um.className = 'msg user';
  um.textContent = text;
  chat.appendChild(um);

  const lm = document.createElement('div');
  lm.className = 'msg loading';
  lm.textContent = 'Разбираю...';
  chat.appendChild(lm);
  lm.scrollIntoView({ behavior: 'smooth', block: 'end' });

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session || !session.access_token) {
      throw new Error('Нужно войти заново');
    }

    const resp = await fetch(SUPA_URL + '/functions/v1/parse-tasks', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + session.access_token
      },
      body: JSON.stringify({ input: text })
    });

    const data = await resp.json();

    if (!resp.ok || data.error) {
      throw new Error(data.error || 'Не удалось разобрать текст');
    }

    const created = data.created || [];

    for (const row of created) {
      tasks.unshift(row);
    }

    lm.classList.remove('loading');
    lm.textContent = 'Создано задач: ' + created.length;

    renderAll();
    switchTabByName('today');
  } catch (e) {
    lm.classList.remove('loading');
    lm.textContent = 'Ошибка: ' + (e instanceof Error ? e.message : String(e));
  }
}

function fmtDate(d){
  if(!d)return null;
  const dt=new Date(d+'T00:00:00');
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.round((dt-today)/86400000);
  if(diff===0)return'сегодня';if(diff===1)return'завтра';if(diff===-1)return'вчера';
  if(diff<0)return'просрочено';
  return dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
async function deleteTask(id){
  await dbFetch('tasks?id=eq.'+id,{method:'DELETE'});
  tasks=tasks.filter(t=>t.id!==id);
  renderAll();
}
function closeAllTaskMenus(){
  document.querySelectorAll('.task-menu.open').forEach(m=>m.classList.remove('open'));
}
function toggleTaskMenu(e,btn){
  e.stopPropagation();
  const menu=btn.nextElementSibling;
  const willOpen=!menu.classList.contains('open');
  closeAllTaskMenus();
  if(willOpen)menu.classList.add('open');
}
let editingTaskId=null;
function openTaskEditor(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  editingTaskId=id;
  document.getElementById('edit-text').value=t.text||'';
  document.getElementById('edit-notes').value=t.notes||'';
  document.getElementById('edit-project').value=t.project||'other';
  document.getElementById('edit-date').value=t.due_date||'';
  document.getElementById('edit-effort').value=t.effort||'';
  document.getElementById('edit-status').value=t.status||'next';
  document.getElementById('edit-urgent').checked=!!t.urgent;
  document.getElementById('edit-important').checked=!!t.important;
  document.getElementById('edit-overlay').classList.add('active');
}
function closeTaskEditor(){
  editingTaskId=null;
  document.getElementById('edit-overlay').classList.remove('active');
}
async function saveTaskEdit(){
  if(editingTaskId===null)return;
  const text=document.getElementById('edit-text').value.trim();
  if(!text){alert('Текст задачи не может быть пустым');return;}
  const status=document.getElementById('edit-status').value||'next';
  const patch={
    text,
    project:document.getElementById('edit-project').value,
    due_date:document.getElementById('edit-date').value||null,
    urgent:document.getElementById('edit-urgent').checked,
    notes:document.getElementById('edit-notes').value.trim()||null,
    important:document.getElementById('edit-important').checked,
    effort:document.getElementById('edit-effort').value||null,
    status
  };
  if(status==='done')patch.done=true;
  await dbFetch('tasks?id=eq.'+editingTaskId,{method:'PATCH',body:JSON.stringify(patch)});
  const t=tasks.find(x=>x.id===editingTaskId);
  if(t)Object.assign(t,patch);
  closeTaskEditor();
  renderAll();
}
function makeTaskEl(t,draggable){
  const proj=PROJECTS.find(p=>p.id===t.project)||PROJECTS[PROJECTS.length-1];
  const ds=fmtDate(t.due_date);
  const isDone=t.done||t.status==='done';
  const isUrgent=!isDone&&(t.urgent||(t.due_date&&new Date(t.due_date+'T00:00:00')<=new Date()));
  const effortOpt=EFFORT_OPTIONS.find(o=>o.id===t.effort);
  const effortName=(t.effort&&effortOpt)?effortOpt.name:'';
  const todayISO=new Date().toISOString().split('T')[0];
  const isOverdue=!t.done&&t.due_date&&t.due_date<todayISO;
  const card=document.createElement('div');card.className='task-card'+(isUrgent?' urgent':'');
  const main=document.createElement('div');main.className='task-main';
  const metaParts=[];
  if(ds)metaParts.push(isOverdue?`<span class="meta-overdue">${ds}</span>`:ds);
  if(effortName)metaParts.push(effortName);
  metaParts.push(`<span class="proj-dot" style="background:${proj.color}"></span>${proj.name}`);
  main.innerHTML=`
    <div class="check${t.done?' done':''}" onclick="toggleTask(${t.id})">
      <svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5L10 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="task-body">
      <div class="task-text${t.done?' done':''}">${t.important?'<span class="imp-star">★</span> ':''}${t.text}</div>
      ${t.desc?`<div class="task-desc">${t.desc}</div>`:''}
      ${t.notes?`<div class="task-notes">${t.notes}</div>`:''}
      <div class="task-meta${isDone?' done':''}">${metaParts.join('<span class="meta-sep"> · </span>')}</div>
    </div>
    <button class="task-menu-btn" onclick="toggleTaskMenu(event,this)">⋯</button>
    <div class="task-menu">
      <button onclick="closeAllTaskMenus();openTaskEditor(${t.id})">Редактировать</button>
      <button class="danger" onclick="closeAllTaskMenus();deleteTask(${t.id})">Удалить</button>
    </div>`;
  card.appendChild(main);
  if(draggable){
    card.draggable=true;
    card.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/plain',String(t.id));
      e.dataTransfer.effectAllowed='move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  }
  return card;
}
let todayShowAllLightning=false;
let todayShowAllRest=false;
function renderToday(){
  const c=document.getElementById('today-content');c.innerHTML='';
  const now=new Date();
  const todayISO=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const st=t=>t.status||'next';
  const isActive=t=>!t.done&&st(t)!=='done';
  const activeStatuses=['next','scheduled','doing'];
  const dueOk=t=>!t.due_date||t.due_date<=todayISO||st(t)==='doing';
  const shownIds=new Set();

  // 1. Лягушка
  const frogCandidates=tasks.filter(t=>isActive(t)&&t.important&&activeStatuses.includes(st(t))&&dueOk(t));
  let frog=frogCandidates.find(t=>['elephant','60m','30m'].includes(t.effort));
  if(!frog)frog=frogCandidates.find(t=>t.effort==='15m'||!t.effort);
  if(frog)shownIds.add(frog.id);

  // 2. Молнии
  const lightningAll=tasks.filter(t=>!shownIds.has(t.id)&&isActive(t)&&(t.effort==='2m'||t.effort==='5m')&&activeStatuses.includes(st(t))&&dueOk(t));
  lightningAll.forEach(t=>shownIds.add(t.id));
  const lightningShown=todayShowAllLightning?lightningAll:lightningAll.slice(0,5);
  const lightningMore=lightningAll.length-lightningShown.length;

  // 3. Кусочек слона
  const elephant=tasks.find(t=>!shownIds.has(t.id)&&isActive(t)&&t.effort==='elephant'&&activeStatuses.includes(st(t))&&dueOk(t));
  if(elephant)shownIds.add(elephant.id);

  // 4. Срочно и важно
  const urgentImportant=tasks.filter(t=>!shownIds.has(t.id)&&isActive(t)&&activeStatuses.includes(st(t))&&dueOk(t)&&(t.urgent||(t.due_date&&t.due_date<=todayISO)));
  urgentImportant.forEach(t=>shownIds.add(t.id));

  // 5. Остальное
  const restAll=tasks.filter(t=>!shownIds.has(t.id)&&isActive(t)&&activeStatuses.includes(st(t))&&dueOk(t));
  restAll.forEach(t=>shownIds.add(t.id));
  const restShown=todayShowAllRest?restAll:restAll.slice(0,10);
  const restMore=restAll.length-restShown.length;

  // 6. Сделано
  const done=tasks.filter(t=>t.done).slice(0,5);

  const totalShown=(frog?1:0)+lightningShown.length+(elephant?1:0)+urgentImportant.length+restShown.length;

  if(totalShown===0){
    const empty=document.createElement('div');empty.className='empty';empty.textContent='Задач на сегодня нет 🎉';c.appendChild(empty);
  }else{
    if(frog){
      const l=document.createElement('div');l.className='section-label';l.textContent='🐸 Съешь лягушку';c.appendChild(l);
      const card=makeTaskEl(frog);card.classList.add('frog');
      const reason=document.createElement('div');reason.className='frog-reason';
      if(frog.effort==='elephant'){
        reason.textContent='🐸 Главная задача дня · большая задача';
      }else{
        const opt=EFFORT_OPTIONS.find(o=>o.id===frog.effort);
        const effortName=(frog.effort&&opt)?opt.name:'';
        reason.textContent='🐸 Главная задача дня · важно'+(effortName?' · '+effortName:'');
      }
      card.querySelector('.task-text').insertAdjacentElement('afterend',reason);
      c.appendChild(card);
    }
    if(lightningShown.length){
      const l=document.createElement('div');l.className='section-label';l.textContent='⚡ Молнии';c.appendChild(l);
      lightningShown.forEach(t=>c.appendChild(makeTaskEl(t)));
      if(lightningMore>0){
        const btn=document.createElement('button');btn.className='more-link';btn.textContent=`ещё ${lightningMore} ⚡`;
        btn.onclick=()=>{todayShowAllLightning=true;renderToday();};
        c.appendChild(btn);
      }
    }
    if(elephant){
      const l=document.createElement('div');l.className='section-label';l.textContent='🐘 Один кусочек слона';c.appendChild(l);
      c.appendChild(makeTaskEl(elephant));
    }
    if(urgentImportant.length){
      const l=document.createElement('div');l.className='section-label';l.textContent='🔥 Срочно и важно';c.appendChild(l);
      urgentImportant.forEach(t=>c.appendChild(makeTaskEl(t)));
    }
    if(restShown.length){
      const l=document.createElement('div');l.className='section-label';l.textContent='📋 Остальное';c.appendChild(l);
      restShown.forEach(t=>c.appendChild(makeTaskEl(t)));
      if(restMore>0){
        const btn=document.createElement('button');btn.className='more-link';btn.textContent=`ещё ${restMore}`;
        btn.onclick=()=>{todayShowAllRest=true;renderToday();};
        c.appendChild(btn);
      }
    }
  }

  if(done.length){
    const l=document.createElement('div');l.className='section-label';l.textContent='✅ Сделано';c.appendChild(l);
    done.forEach(t=>c.appendChild(makeTaskEl(t)));
  }

  // Индикатор скрытых задач
  const inboxCount=tasks.filter(t=>isActive(t)&&st(t)==='inbox').length;
  const waitingCount=tasks.filter(t=>isActive(t)&&st(t)==='waiting').length;
  const laterCount=tasks.filter(t=>isActive(t)&&t.due_date&&t.due_date>todayISO&&st(t)!=='doing').length;
  const parts=[];
  if(inboxCount)parts.push(`Входящие: ${inboxCount}`);
  if(waitingCount)parts.push(`Ожидаю: ${waitingCount}`);
  if(laterCount)parts.push(`Позже: ${laterCount}`);
  if(parts.length){
    const ind=document.createElement('div');ind.className='today-indicator';
    ind.textContent=parts.join(' · ')+' → Доска';
    ind.onclick=()=>switchTabByName('board');
    c.appendChild(ind);
  }
}
function renderProjects(){
  const c=document.getElementById('proj-content');c.innerHTML='';
  PROJECTS.forEach(proj=>{
    const pt=tasks.filter(t=>t.project===proj.id);if(!pt.length)return;
    const done=pt.filter(t=>t.done).length;
    const pct=Math.round(done/pt.length*100);
    const card=document.createElement('div');card.className='proj-card';
    card.innerHTML=`<div class="proj-header"><div class="proj-dot" style="background:${proj.color}"></div><div class="proj-name">${proj.name}</div><div class="proj-pct">${pct}%</div></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${proj.color}"></div></div>`;
    pt.forEach(t=>card.appendChild(makeTaskEl(t)));
    c.appendChild(card);
  });
  if(!tasks.length)c.innerHTML='<div class="empty">Задач пока нет</div>';
}
async function moveTaskToStatus(id,status){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const patch={status,done:status==='done'};
  if(status==='next')patch.due_date=null;
  await dbFetch('tasks?id=eq.'+id,{method:'PATCH',body:JSON.stringify(patch)});
  Object.assign(t,patch);
  renderAll();
}
function renderBoard(){
  const c=document.getElementById('board-content');c.innerHTML='';
  BOARD_COLUMNS.forEach(col=>{
    const colTasks=tasks.filter(col.match);
    const colEl=document.createElement('div');colEl.className='board-col';
    const header=document.createElement('div');header.className='board-col-header';
    header.innerHTML=`<span>${col.name}</span><span class="board-col-count">${colTasks.length}</span>`;
    colEl.appendChild(header);
    const body=document.createElement('div');body.className='board-col-tasks';
    colTasks.forEach(t=>body.appendChild(makeTaskEl(t,true)));
    colEl.appendChild(body);
    colEl.addEventListener('dragover',e=>{e.preventDefault();colEl.classList.add('drag-over');});
    colEl.addEventListener('dragleave',()=>colEl.classList.remove('drag-over'));
    colEl.addEventListener('drop',e=>{
      e.preventDefault();
      colEl.classList.remove('drag-over');
      const id=Number(e.dataTransfer.getData('text/plain'));
      if(id)moveTaskToStatus(id,col.status);
    });
    c.appendChild(colEl);
  });
}
function renderDone(){
  const c=document.getElementById('done-content');c.innerHTML='';
  const done=tasks.filter(t=>t.done);
  if(!done.length){c.innerHTML='<div class="empty">Пока ничего не выполнено</div>';return;}
  done.forEach(t=>c.appendChild(makeTaskEl(t)));
}
function renderAll(){renderToday();renderBoard();renderProjects();renderDone();}
function switchTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-'+name).classList.add('active');
}
function switchTabByName(name){
  const tabs=document.querySelectorAll('.tab');
  const views=['secretary','today','board','projects','done'];
  const idx=views.indexOf(name);
  if(idx>=0){tabs.forEach(t=>t.classList.remove('active'));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));tabs[idx].classList.add('active');document.getElementById('view-'+name).classList.add('active');}
}
document.getElementById('edit-project').innerHTML=PROJECTS.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
document.getElementById('edit-effort').innerHTML=EFFORT_OPTIONS.map(o=>`<option value="${o.id}">${o.name}</option>`).join('');
document.getElementById('edit-status').innerHTML=STATUS_OPTIONS.map(o=>`<option value="${o.id}">${o.name}</option>`).join('');
document.addEventListener('click',closeAllTaskMenus);
document.getElementById('tinput').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))sendMsg();});
document.getElementById('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
const d=new Date();
document.getElementById('hdate').textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(session){showApp();loadTasks();}
  else{tasks=[];renderAll();showLogin();}
});
</script>
