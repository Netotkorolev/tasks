<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Задачи — Егор</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#111;color:#f0f0f0;min-height:100vh}
header{background:#1c1c1e;padding:16px;border-bottom:1px solid #2c2c2e;position:sticky;top:0;z-index:100}
header h1{font-size:20px;font-weight:700}
header p{font-size:12px;color:#666;margin-top:2px}
.tabs{display:flex;background:#1c1c1e;border-bottom:1px solid #2c2c2e;position:sticky;top:53px;z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;min-width:64px;text-align:center;padding:11px 10px;font-size:12px;font-weight:500;color:#666;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:#fff;border-bottom-color:#fff}
.view{display:none;padding:12px 16px 100px}
.view.active{display:block}
.chat-box{background:#1c1c1e;border-radius:14px;padding:14px;margin-bottom:12px;min-height:60px}
.msg{padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.5;margin-bottom:8px;max-width:88%}
.msg.user{background:#1a56db;color:#fff;margin-left:auto}
.msg.bot{background:#2c2c2e;color:#f0f0f0}
.msg.loading{background:#2c2c2e;color:#888;font-style:italic}
textarea{width:100%;background:#1c1c1e;border:1px solid #2c2c2e;border-radius:12px;padding:14px;font-size:16px;line-height:1.4;color:#f0f0f0;resize:vertical;min-height:140px;font-family:inherit}
textarea:focus{outline:none;border-color:#444}
textarea::placeholder{color:#555}
.send-btn{width:100%;margin-top:8px;padding:12px;background:#1a56db;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.send-btn:active{opacity:0.85}
.hint{font-size:12px;color:#555;margin-top:6px;text-align:center}
.section-label{font-size:11px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px}
.task-card{background:#1c1c1e;border-radius:12px;margin-bottom:8px;overflow:hidden}
.task-main{display:flex;align-items:flex-start;gap:12px;padding:13px}
.check{width:22px;height:22px;border-radius:50%;border:2px solid #444;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px;transition:all 0.15s}
.check.done{background:#1a56db;border-color:#1a56db}
.check svg{display:none}
.check.done svg{display:block}
.task-body{flex:1;min-width:0}
.task-text{font-size:15px;line-height:1.35;color:#f0f0f0}
.task-text.done{text-decoration:line-through;opacity:0.4}
.task-desc{font-size:12px;color:#666;margin-top:3px}
.task-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.badge{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:500}
.badge.urgent{background:#3a1a1a;color:#ff453a}
.badge.date{background:#2c2c2e;color:#888}
.proj-card{background:#1c1c1e;border-radius:12px;margin-bottom:12px;padding:14px}
.proj-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.proj-dot{width:9px;height:9px;border-radius:50%}
.proj-name{font-size:15px;font-weight:600;flex:1}
.proj-pct{font-size:12px;color:#666}
.prog-bar{height:4px;background:#2c2c2e;border-radius:2px;margin-bottom:10px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px}
.empty{text-align:center;color:#555;font-size:14px;padding:30px 0}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.login-box{background:#1c1c1e;border-radius:14px;padding:24px;width:100%;max-width:360px}
.login-box h2{font-size:20px;margin-bottom:16px;text-align:center}
.login-box input{width:100%;background:#111;border:1px solid #2c2c2e;border-radius:10px;padding:12px;font-size:14px;color:#f0f0f0;margin-bottom:10px;font-family:inherit}
.login-box input:focus{outline:none;border-color:#444}
.login-error{color:#ff453a;font-size:13px;margin-top:8px;text-align:center;min-height:16px}
.header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.logout-btn{background:none;border:1px solid #2c2c2e;color:#888;font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <h2>Вход</h2>
    <input type="email" id="login-email" placeholder="Email" value="eakorolev@gmail.com">
    <input type="password" id="login-password" placeholder="Пароль">
    <button class="send-btn" onclick="login()">Войти</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>
<div id="app" style="display:none">
<header>
  <div class="header-row">
    <div>
      <h1>Задачи</h1>
      <p id="hdate"></p>
    </div>
    <button class="logout-btn" onclick="logout()">Выйти</button>
  </div>
</header>
<div class="tabs">
  <button class="tab active" onclick="switchTab('secretary',this)">Секретарь</button>
  <button class="tab" onclick="switchTab('today',this)">Сегодня</button>
  <button class="tab" onclick="switchTab('all',this)">Все</button>
  <button class="tab" onclick="switchTab('projects',this)">Проекты</button>
  <button class="tab" onclick="switchTab('done',this)">Выполнено</button>
</div>
<div class="view active" id="view-secretary">
  <div class="chat-box" id="chat"></div>
  <textarea id="tinput" placeholder="Пиши задачи в свободной форме. Например: надо сегодня забрать Петра из больницы до 15, написать Зимину по попкорну до пятницы, на неделе 2 поста для канала..."></textarea>
  <button class="send-btn" onclick="sendMsg()">Разобрать задачи</button>
  <div class="hint">Напиши или надиктуй всё одним текстом — секретарь разложит по задачам.</div>
</div>
<div class="view" id="view-today"><div id="today-content"></div></div>
<div class="view" id="view-all"><div id="all-content"></div></div>
<div class="view" id="view-projects"><div id="proj-content"></div></div>
<div class="view" id="view-done"><div id="done-content"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://apijeywkwtjezgeuhkhm.supabase.co';
const SUPA_KEY='sb_publishable_xYbI9DTHWUME1YZlc2dCCw_jHr9D273';
const PROJECTS=[
  {id:'law',name:'Судебное дело',color:'#ff453a'},
  {id:'popcorn',name:'Rush Попкорн',color:'#ff9f0a'},
  {id:'politics',name:'Новые люди',color:'#0a84ff'},
  {id:'fencing',name:'Не тот Королёв',color:'#30d158'},
  {id:'china',name:'Маркетплейсы',color:'#bf5af2'},
  {id:'istra',name:'Помещение Истра',color:'#888'},
  {id:'tma',name:'Telegram Mini Apps',color:'#5ac8fa'},
  {id:'health',name:'Пётр Михайлович',color:'#ff375f'},
  {id:'personal',name:'Личное',color:'#aaa'},
  {id:'other',name:'Разное',color:'#666'},
];
const supabaseClient=supabase.createClient(SUPA_URL,SUPA_KEY);
let tasks=[];
async function dbFetch(path,opts={}){
  const {data:{session}}=await supabaseClient.auth.getSession();
  const token=session?session.access_token:SUPA_KEY;
  const r=await fetch(SUPA_URL+'/rest/v1/'+path,{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json','Prefer':'return=representation',...(opts.headers||{})},
    ...opts
  });
  const txt=await r.text();
  return txt?JSON.parse(txt):[];
}
async function login(){
  const email=document.getElementById('login-email').value.trim();
  const password=document.getElementById('login-password').value;
  const errEl=document.getElementById('login-error');
  errEl.textContent='';
  if(!email||!password){errEl.textContent='Введите email и пароль';return;}
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)errEl.textContent='Ошибка входа: '+error.message;
}
async function logout(){
  await supabaseClient.auth.signOut();
}
function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='';
}
function showLogin(){
  document.getElementById('login-screen').style.display='';
  document.getElementById('app').style.display='none';
  document.getElementById('login-password').value='';
}
async function loadTasks(){
  try{tasks=await dbFetch('tasks?select=*&order=created_at.desc');}catch(e){tasks=[];}
  renderAll();
}
async function toggleTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;
  await dbFetch('tasks?id=eq.'+id,{method:'PATCH',body:JSON.stringify({done:t.done})});
  renderAll();
}
async function sendMsg(){
  const inp = document.getElementById('tinput');
  const text = inp.value.trim();
  if (!text) return;

  inp.value = '';

  const chat = document.getElementById('chat');

  const um = document.createElement('div');
  um.className = 'msg user';
  um.textContent = text;
  chat.appendChild(um);

  const lm = document.createElement('div');
  lm.className = 'msg loading';
  lm.textContent = 'Разбираю...';
  chat.appendChild(lm);

  try {
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session || !session.access_token) {
      throw new Error('Нужно войти заново');
    }

    const resp = await fetch(SUPA_URL + '/functions/v1/parse-tasks', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPA_KEY,
        'Authorization': 'Bearer ' + session.access_token
      },
      body: JSON.stringify({ input: text })
    });

    const data = await resp.json();

    if (!resp.ok || data.error) {
      throw new Error(data.error || 'Не удалось разобрать текст');
    }

    const created = data.created || [];

    for (const row of created) {
      tasks.unshift(row);
    }

    lm.classList.remove('loading');
    lm.textContent = 'Создано задач: ' + created.length;

    renderAll();
    switchTabByName('today');
  } catch (e) {
    lm.classList.remove('loading');
    lm.textContent = 'Ошибка: ' + (e instanceof Error ? e.message : String(e));
  }
}

function fmtDate(d){
  if(!d)return null;
  const dt=new Date(d+'T00:00:00');
  const today=new Date();today.setHours(0,0,0,0);
  const diff=Math.round((dt-today)/86400000);
  if(diff===0)return'сегодня';if(diff===1)return'завтра';if(diff===-1)return'вчера';
  if(diff<0)return'просрочено';
  return dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}
function makeTaskEl(t){
  const proj=PROJECTS.find(p=>p.id===t.project)||PROJECTS[PROJECTS.length-1];
  const ds=fmtDate(t.due_date);
  const isUrgent=t.urgent||(t.due_date&&new Date(t.due_date+'T00:00:00')<=new Date());
  const card=document.createElement('div');card.className='task-card';
  const main=document.createElement('div');main.className='task-main';
  main.innerHTML=`
    <div class="check${t.done?' done':''}" onclick="toggleTask(${t.id})">
      <svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4.5L4 7.5L10 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="task-body">
      <div class="task-text${t.done?' done':''}">${t.text}</div>
      ${t.desc?`<div class="task-desc">${t.desc}</div>`:''}
      <div class="task-badges">
        ${isUrgent?'<span class="badge urgent">срочно</span>':''}
        ${ds?`<span class="badge date">${ds}</span>`:''}
        <span class="badge" style="background:${proj.color}33;color:${proj.color}">${proj.name}</span>
      </div>
    </div>`;
  card.appendChild(main);
  return card;
}
function renderToday(){
  const c=document.getElementById('today-content');c.innerHTML='';
  const todayISO=new Date().toISOString().split('T')[0];
  const urgent=tasks.filter(t=>!t.done&&(t.urgent||(t.due_date&&t.due_date<=todayISO)));
  const rest=tasks.filter(t=>!t.done&&!t.urgent&&(!t.due_date||t.due_date>todayISO)).slice(0,15);
  const done=tasks.filter(t=>t.done).slice(0,5);
  if(!urgent.length&&!rest.length){c.innerHTML='<div class="empty">Задач на сегодня нет 🎉</div>';return;}
  if(urgent.length){const l=document.createElement('div');l.className='section-label';l.textContent='Срочно';c.appendChild(l);urgent.forEach(t=>c.appendChild(makeTaskEl(t)));}
  if(rest.length){const l=document.createElement('div');l.className='section-label';l.textContent='Остальные';c.appendChild(l);rest.forEach(t=>c.appendChild(makeTaskEl(t)));}
  if(done.length){const l=document.createElement('div');l.className='section-label';l.textContent='Выполнено';c.appendChild(l);done.forEach(t=>c.appendChild(makeTaskEl(t)));}
}
function renderProjects(){
  const c=document.getElementById('proj-content');c.innerHTML='';
  PROJECTS.forEach(proj=>{
    const pt=tasks.filter(t=>t.project===proj.id);if(!pt.length)return;
    const done=pt.filter(t=>t.done).length;
    const pct=Math.round(done/pt.length*100);
    const card=document.createElement('div');card.className='proj-card';
    card.innerHTML=`<div class="proj-header"><div class="proj-dot" style="background:${proj.color}"></div><div class="proj-name">${proj.name}</div><div class="proj-pct">${pct}%</div></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${proj.color}"></div></div>`;
    pt.forEach(t=>card.appendChild(makeTaskEl(t)));
    c.appendChild(card);
  });
  if(!tasks.length)c.innerHTML='<div class="empty">Задач пока нет</div>';
}
function renderAllTasks(){
  const c=document.getElementById('all-content');c.innerHTML='';
  const active=tasks.filter(t=>!t.done);
  if(!active.length){c.innerHTML='<div class="empty">Задач нет 🎉</div>';return;}
  active.forEach(t=>c.appendChild(makeTaskEl(t)));
}
function renderDone(){
  const c=document.getElementById('done-content');c.innerHTML='';
  const done=tasks.filter(t=>t.done);
  if(!done.length){c.innerHTML='<div class="empty">Пока ничего не выполнено</div>';return;}
  done.forEach(t=>c.appendChild(makeTaskEl(t)));
}
function renderAll(){renderToday();renderAllTasks();renderProjects();renderDone();}
function switchTab(name,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-'+name).classList.add('active');
}
function switchTabByName(name){
  const tabs=document.querySelectorAll('.tab');
  const views=['secretary','today','all','projects','done'];
  const idx=views.indexOf(name);
  if(idx>=0){tabs.forEach(t=>t.classList.remove('active'));document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));tabs[idx].classList.add('active');document.getElementById('view-'+name).classList.add('active');}
}
document.getElementById('tinput').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))sendMsg();});
document.getElementById('login-password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
const d=new Date();
document.getElementById('hdate').textContent=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
supabaseClient.auth.onAuthStateChange((event,session)=>{
  if(session){showApp();loadTasks();}
  else{tasks=[];renderAll();showLogin();}
});
</script>
</body>
</html>
